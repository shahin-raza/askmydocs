[project]
name = "askmydocs"
version = "0.1.0"
description = "A local RAG application for asking questions about your documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.0",
    "pypdf>=5.0.0",
    "docx2txt>=0.9",
    "unstructured>=0.18.0",
    "uvicorn[standard]>=0.34.0",
]
